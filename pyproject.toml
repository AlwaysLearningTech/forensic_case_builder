[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic_case_builder"
version = "0.1.0"
description = "Local-first evidence pipeline for forensic case building"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "PyPDF2>=3.0.0",
    "openpyxl>=3.0.0",
    "python-docx>=0.8.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
forensic-case-builder = "forensic_case_builder.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["forensic_case_builder*"]
